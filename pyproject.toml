[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litesearch"
dynamic = ["version"]
description = "search through files with fts5, vectors and get reranked results. Fast"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "71293", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'fts+vectors', 'semantic search', 'vector search', 'text search', 'document search']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = [
    "chonkie>=1.6.0",
    "codesigs>=0.0.2",
    "fastlite>=0.2.4",
    "liteparse>=2.6.0",
    "model2vec>=0.7.0",
    "pdf-oxide>=0.3.17",
    "pillow>=12.1.1",
    "usearch>=2.23.0",
]

[project.urls]
Repository = "https://github.com/Karthik777/litesearch"
Documentation = "https://Karthik777.github.io/litesearch"

[project.scripts]
litesearch = "litesearch.cli:main"

[project.entry-points.nbdev]
litesearch = "litesearch._modidx:d"

[dependency-groups]
dev = [
    "nbdev",
    "jupyterlab",
    "jupyterlab-quarto",
    "notebook",
    "flashrank>=0.2.10",         # `rerank=True`, imported on use
    "vruksha>=0.0.1",            # evals/ and the graph= seam in `context`
    "ganapati>=0.0.1",           # evals/ and the Sanskrit profiles
    "onnx>=1.22.0",              # evals/onnx.py
    "onnxruntime>=1.24.3",       # evals/onnx.py
    "tokenizers>=0.22.2",        # evals/onnx.py
    "model2vec[distill]>=0.7.0", # evals/
    "datasets>=5.0.1",           # evals/
    "rishi>=0.0.2",              # evals/
    "koshas>=0.0.25",            # evals/
    "fastprogress>=1.1.5",       # evals/
    "selectolax",                # evals/
    "ddgs",                      # evals/
    "pyperclip",                 # evals/
]

[tool.hatch.version]
path = "litesearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["litesearch"]

[tool.hatch.build.targets.sdist]
include = [
    "/litesearch",
    "/README.md",
    "/pyproject.toml",
]

[tool.nbdev]